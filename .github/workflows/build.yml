name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      # 디버그 서명으로 빌드한 APK. Actions 탭 → 해당 실행 → Artifacts 에서 받아 폰에 바로 설치할 수 있어요.
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: recycle-ai-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

  # 웹 버전을 GitHub Pages에 올려요. 설치 없이 브라우저에서 바로 써볼 수 있어요.
  deploy-web:
    if: github.event_name != 'pull_request'
    needs: check-and-build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build web --release --base-href /recycle-ai-/
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web
      - id: deployment
        uses: actions/deploy-pages@v4
