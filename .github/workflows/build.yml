name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      # 디버그 서명으로 빌드한 APK. Actions 탭 → 해당 실행 → Artifacts 에서 받아 폰에 바로 설치할 수 있어요.
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: recycle-ai-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
