name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get
      - name: Firebase 설정 파일 준비
        run: bash tool/firebase_placeholders.sh
        env:
          FIREBASE_OPTIONS_DART: ${{ secrets.FIREBASE_OPTIONS_DART }}
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
      - run: flutter analyze
      - run: flutter test

      # 디버그 서명으로 빌드한 APK. Actions 탭 → 해당 실행 → Artifacts 에서 받아 폰에 바로 설치할 수 있어요.
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: recycle-ai-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

  # 웹 버전을 gh-pages 브랜치에 올려요. 저장소 Settings → Pages 에서 소스를 gh-pages 로 두면
  # https://idealworld920.github.io/recycle-ai-/ 에서 설치 없이 바로 써볼 수 있어요.
  deploy-web:
    if: github.event_name != 'pull_request'
    needs: check-and-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Firebase 설정 파일 준비
        run: bash tool/firebase_placeholders.sh
        env:
          FIREBASE_OPTIONS_DART: ${{ secrets.FIREBASE_OPTIONS_DART }}
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
      - run: flutter build web --release --base-href /recycle-ai-/
      - run: touch build/web/.nojekyll
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/web
          publish_branch: gh-pages
          force_orphan: true
